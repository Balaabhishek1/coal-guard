name: Backend CI

'on':
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Pytest & Linting (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: coalguard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1 \
            tesseract-ocr \
            tesseract-ocr-eng \
            ghostscript \
            postgresql-client

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r backend/requirements.txt
          pip install flake8 ruff

      - name: Code Quality & Linting
        run: |
          ruff check backend/app
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/coalguard_test
        run: |
          cd backend
          alembic upgrade head

      - name: Execute Automated Test Suite (Pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/coalguard_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          JWT_SECRET: statutory_ci_test_secret_key_2026
          ENVIRONMENT: testing
          DEBUG: "false"
        run: |
          cd backend
          pytest -v
