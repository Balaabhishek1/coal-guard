name: Frontend CI

'on':
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  test-and-build:
    name: Lint, Test & Vite Build (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Static Type-Checking & Linting
        run: |
          cd frontend
          npm run lint

      - name: Execute Vitest Unit & Integration Suites
        run: |
          cd frontend
          npx vitest run

      - name: Verify Production Vite Bundle
        run: |
          cd frontend
          npm run build
